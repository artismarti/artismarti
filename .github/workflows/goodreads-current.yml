name: Currently reading on Goodreads
on:
  schedule: # Run workflow automatically
    # This will make it run every night at 10:01 PM
    - cron: "1 22 * * *"
  workflow_dispatch:
concurrency:
  group: goodreads-readme-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update-readme-with-goodreads-books:
    name: Update this repo's README with what you're currently reading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check profile parser
        run: python -m unittest discover -s .github/scripts
      - name: Update currently reading
        run: python .github/scripts/update_currently_reading.py
      - name: Commit book list
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "goodreads-books-bot"
          git config user.email "goodreads-books-bot@example.com"
          git add README.md
          git commit -m "Update currently reading books"
          git push
